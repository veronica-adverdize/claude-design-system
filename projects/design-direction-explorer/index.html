<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Direction Explorer</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--shell-bg:#09090b;--shell-surface:#18181b;--shell-border:#27272a;--shell-text:#fafafa;--shell-muted:#a1a1aa;--shell-accent:#3b82f6;--shell-header:56px;--shell-sidebar:320px;--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--shell-bg);color:var(--shell-text);line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh}

/* === SHELL === */
.shell-header{position:fixed;top:0;left:0;right:0;height:var(--shell-header);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--shell-bg);border-bottom:1px solid var(--shell-border);z-index:100}
.shell-logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;letter-spacing:-0.02em;white-space:nowrap}
.shell-logo__mark{width:24px;height:24px;background:var(--shell-accent);border-radius:6px;display:flex;align-items:center;justify-content:center}
.shell-logo__mark svg{width:14px;height:14px}
.shell-controls{display:flex;align-items:center;gap:8px}
.shell-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding:0 12px;font:500 13px/1 'Inter',system-ui,sans-serif;color:var(--shell-muted);background:transparent;border:1px solid var(--shell-border);border-radius:6px;cursor:pointer;transition:background 150ms ease,color 150ms ease}
.shell-btn:hover{background:var(--shell-surface);color:var(--shell-text)}
.shell-btn:focus-visible{outline:2px solid var(--shell-accent);outline-offset:2px}
.shell-btn[aria-pressed="true"]{background:var(--shell-accent);color:#fff;border-color:var(--shell-accent)}
.shell-btn--primary{background:var(--shell-accent);color:#fff;border-color:var(--shell-accent)}
.shell-btn--primary:hover{opacity:0.9}
.shell-sidebar{position:fixed;top:var(--shell-header);left:0;bottom:0;width:var(--shell-sidebar);background:var(--shell-bg);border-right:1px solid var(--shell-border);overflow-y:auto;z-index:90;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:var(--shell-border) transparent}
.sidebar-section{padding:16px}.sidebar-section+.sidebar-section{border-top:1px solid var(--shell-border)}
.sidebar-label{font-size:11px;font-weight:600;color:var(--shell-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px}
.dir-card{padding:12px;border:1px solid var(--shell-border);border-radius:8px;cursor:pointer;margin-bottom:6px;transition:border-color 150ms ease,background 150ms ease;position:relative}
.dir-card:hover{background:var(--shell-surface)}
.dir-card:focus-visible{outline:2px solid var(--shell-accent);outline-offset:2px}
.dir-card[aria-pressed="true"]{border-color:var(--shell-accent);background:color-mix(in srgb,var(--shell-accent) 8%,transparent)}
.dir-card__name{font-size:13px;font-weight:600;margin-bottom:2px}
.dir-card__desc{font-size:11px;color:var(--shell-muted);line-height:1.4}
.dir-card__palette{display:flex;gap:3px;margin-top:8px}
.dir-card__swatch{width:16px;height:16px;border-radius:4px;border:1px solid rgba(255,255,255,0.1)}
.dir-card__compare{position:absolute;top:10px;right:10px;width:18px;height:18px;border:1.5px solid var(--shell-border);border-radius:4px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 150ms ease,border-color 150ms ease;padding:0}
.dir-card__compare:hover{border-color:var(--shell-muted)}
.dir-card__compare[aria-checked="true"]{background:var(--shell-accent);border-color:var(--shell-accent)}
.dir-card__compare:focus-visible{outline:2px solid var(--shell-accent);outline-offset:2px}
.dir-card__check{display:none}.dir-card__compare[aria-checked="true"] .dir-card__check{display:block}
.mixer-panel{display:none;flex-direction:column;gap:12px}.mixer-panel.active{display:flex}
.mixer-select-group label{display:block;font-size:11px;font-weight:600;color:var(--shell-muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px}
.mixer-select{width:100%;height:32px;padding:0 8px;font:500 12px/32px 'Inter',system-ui,sans-serif;color:var(--shell-text);background:var(--shell-surface);border:1px solid var(--shell-border);border-radius:6px;cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23a1a1aa' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center}
.mixer-select:focus-visible{outline:2px solid var(--shell-accent);outline-offset:2px}
.shell-preview{position:fixed;top:var(--shell-header);left:var(--shell-sidebar);right:0;bottom:0;overflow-y:auto;overflow-x:hidden;background:#fff}
.shell-preview.compare-mode{display:grid;grid-template-columns:1fr 1fr}
.shell-preview.compare-mode .preview-pane{overflow-y:auto;height:calc(100vh - var(--shell-header));border-right:2px solid var(--shell-border)}
.shell-preview.compare-mode .preview-pane:last-child{border-right:none}
.preview-pane__label{position:sticky;top:0;z-index:10;padding:6px 16px;font:600 11px/1 'Inter',system-ui,sans-serif;text-transform:uppercase;letter-spacing:0.05em;background:var(--shell-bg);color:var(--shell-muted);border-bottom:1px solid var(--shell-border);display:none}
.compare-mode .preview-pane__label{display:block}
.shell-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);padding:8px 16px;background:var(--shell-surface);color:var(--shell-text);font-size:13px;font-weight:500;border:1px solid var(--shell-border);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,0.4);opacity:0;pointer-events:none;transition:opacity 200ms ease,transform 200ms ease;z-index:200}
.shell-toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}
.contrast-warn{color:#fbbf24;font-size:11px;margin-top:6px;display:none;line-height:1.3}.contrast-warn.visible{display:block}
.shell-menu-btn{display:none;width:32px;height:32px;background:transparent;border:1px solid var(--shell-border);border-radius:6px;cursor:pointer;color:var(--shell-text);align-items:center;justify-content:center}
.shell-menu-btn:focus-visible{outline:2px solid var(--shell-accent);outline-offset:2px}
.shell-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:85}
@media(max-width:899px){.shell-menu-btn{display:flex}.shell-sidebar{transform:translateX(-100%);transition:transform 300ms var(--ease-out);width:300px;z-index:110;top:0}.shell-sidebar.open{transform:translateX(0)}.shell-backdrop.open{display:block;z-index:105}.shell-preview{left:0}.shell-preview.compare-mode{grid-template-columns:1fr}}
@media(max-width:599px){.shell-header{padding:0 12px}.shell-logo span{display:none}}

/* ============================= */
/* PREVIEW — shared base         */
/* ============================= */
.preview{font-family:var(--d-font-body);font-size:var(--d-body-size);color:var(--d-text);background:var(--d-bg);line-height:1.6;min-height:100%}
.p-pad{padding-left:clamp(16px,4vw,48px);padding-right:clamp(16px,4vw,48px)}
.p-nav{display:flex;align-items:center;justify-content:space-between;padding:16px clamp(16px,4vw,48px);border-bottom:1px solid var(--d-border);background:var(--d-bg);position:relative;z-index:5}
.p-nav__brand{font-family:var(--d-font-heading);font-weight:var(--d-heading-weight);font-size:18px;letter-spacing:var(--d-heading-tracking);color:var(--d-text)}
.p-nav__links{display:flex;gap:24px;list-style:none}
.p-nav__link{font-size:14px;font-weight:500;color:var(--d-muted);text-decoration:none;cursor:default}
@media(max-width:599px){.p-nav__links{display:none}}
.p-nav__cta{display:inline-flex;align-items:center;height:36px;padding:0 16px;font:600 13px/1 var(--d-font-body);color:var(--d-accent-fg);background:var(--d-accent);border:none;border-radius:var(--d-radius);cursor:pointer}
.p-hero{padding:var(--d-section-pad) clamp(16px,4vw,48px);background:var(--d-hero-bg);position:relative;overflow:hidden}
.p-hero--center{text-align:center}
.p-hero--left{text-align:left}
.p-hero--split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,64px);align-items:center}
@media(max-width:699px){.p-hero--split{grid-template-columns:1fr}}
.p-hero__kicker{display:inline-block;font-family:var(--d-font-mono);font-size:12px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--d-accent);margin-bottom:16px;padding:4px 12px;border:1px solid var(--d-border);border-radius:100px}
.p-hero__title{font-family:var(--d-font-heading);font-size:var(--d-hero-size);font-weight:var(--d-heading-weight);letter-spacing:var(--d-heading-tracking);line-height:1.08;color:var(--d-text);margin-bottom:20px}
.p-hero--center .p-hero__title{max-width:16ch;margin-left:auto;margin-right:auto}
.p-hero__subtitle{font-size:clamp(15px,1.2vw,18px);color:var(--d-muted);max-width:520px;margin-bottom:32px;line-height:1.6}
.p-hero--center .p-hero__subtitle{margin-left:auto;margin-right:auto}
.p-hero__actions{display:flex;gap:12px;flex-wrap:wrap}
.p-hero--center .p-hero__actions{justify-content:center}
.p-hero__visual{position:relative}
.p-hero__visual svg{width:100%;height:auto;display:block}
.p-btn{display:inline-flex;align-items:center;justify-content:center;height:48px;min-width:48px;padding:0 24px;font:600 15px/1 var(--d-font-body);border-radius:var(--d-radius);cursor:pointer;border:none;text-decoration:none}
.p-btn:focus-visible{outline:2px solid var(--d-accent);outline-offset:2px}
.p-btn--primary{background:var(--d-accent);color:var(--d-accent-fg)}
.p-btn--secondary{background:transparent;color:var(--d-text);border:1px solid var(--d-border)}

/* Features */
.p-features{padding:var(--d-section-pad) clamp(16px,4vw,48px)}
.p-features__header{text-align:center;margin-bottom:clamp(32px,4vw,56px)}
.p-features__title{font-family:var(--d-font-heading);font-size:clamp(1.5rem,3vw,2.5rem);font-weight:var(--d-heading-weight);letter-spacing:var(--d-heading-tracking);margin-bottom:8px}
.p-features__subtitle{font-size:15px;color:var(--d-muted);max-width:440px;margin:0 auto}
.p-features__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,24px);max-width:960px;margin:0 auto}
@media(max-width:699px){.p-features__grid{grid-template-columns:1fr}}
.p-feature{padding:clamp(20px,2.5vw,32px);background:var(--d-surface);border:1px solid var(--d-border);border-radius:var(--d-radius)}
.p-feature__icon{width:40px;height:40px;border-radius:calc(var(--d-radius)*0.8);background:color-mix(in srgb,var(--d-accent) 10%,transparent);display:flex;align-items:center;justify-content:center;margin-bottom:16px;color:var(--d-accent)}
.p-feature__title{font-family:var(--d-font-heading);font-size:18px;font-weight:600;letter-spacing:var(--d-heading-tracking);margin-bottom:6px}
.p-feature__desc{font-size:14px;color:var(--d-muted);line-height:1.6}

/* Proof / Stats */
.p-proof{padding:var(--d-section-pad) clamp(16px,4vw,48px);background:var(--d-surface);border-top:1px solid var(--d-border);border-bottom:1px solid var(--d-border)}
.p-proof__header{text-align:center;margin-bottom:clamp(24px,3vw,48px)}
.p-proof__title{font-family:var(--d-font-heading);font-size:clamp(1.25rem,2.5vw,2rem);font-weight:var(--d-heading-weight);letter-spacing:var(--d-heading-tracking);margin-bottom:8px}
.p-proof__subtitle{font-size:15px;color:var(--d-muted)}
.p-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,32px);max-width:720px;margin:0 auto;text-align:center}
@media(max-width:499px){.p-stats{grid-template-columns:1fr;gap:24px}}
.p-stat__number{font-family:var(--d-font-heading);font-size:clamp(2rem,4vw,3rem);font-weight:var(--d-heading-weight);letter-spacing:var(--d-heading-tracking);color:var(--d-accent);line-height:1.1}
.p-stat__label{font-size:13px;color:var(--d-muted);margin-top:4px}

/* CTA */
.p-cta-banner{padding:var(--d-section-pad) clamp(16px,4vw,48px);text-align:center}
.p-cta-banner__title{font-family:var(--d-font-heading);font-size:clamp(1.5rem,3vw,2.5rem);font-weight:var(--d-heading-weight);letter-spacing:var(--d-heading-tracking);margin-bottom:12px}
.p-cta-banner__desc{font-size:15px;color:var(--d-muted);max-width:440px;margin:0 auto 24px}

/* Footer */
.p-footer{padding:24px clamp(16px,4vw,48px);border-top:1px solid var(--d-border);font-size:13px;color:var(--d-muted);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}

/* ============================= */
/* DIRECTION-SPECIFIC ELEMENTS   */
/* ============================= */

/* Editorial: pullquote, divider, 2-col features */
.p-divider{border:none;border-top:1px solid var(--d-border);margin:0 clamp(16px,4vw,48px)}
.p-pullquote{padding:clamp(40px,6vw,80px) clamp(16px,4vw,48px);text-align:center}
.p-pullquote blockquote{font-family:var(--d-font-heading);font-size:clamp(1.5rem,3vw,2.25rem);font-weight:var(--d-heading-weight);letter-spacing:var(--d-heading-tracking);font-style:italic;line-height:1.35;max-width:36ch;margin:0 auto 16px;color:var(--d-text)}
.p-pullquote cite{font-family:var(--d-font-body);font-size:13px;color:var(--d-muted);font-style:normal}
.p-features--editorial .p-features__grid{grid-template-columns:1fr 1fr;max-width:800px}
@media(max-width:599px){.p-features--editorial .p-features__grid{grid-template-columns:1fr}}

/* Technical: code block, metrics strip */
.p-codeblock{padding:clamp(32px,4vw,64px) clamp(16px,4vw,48px)}
.p-codeblock__inner{max-width:640px;margin:0 auto;background:var(--d-surface);border:1px solid var(--d-border);border-radius:var(--d-radius);overflow:hidden}
.p-codeblock__header{padding:10px 16px;font-family:var(--d-font-mono);font-size:12px;color:var(--d-muted);border-bottom:1px solid var(--d-border);display:flex;align-items:center;gap:8px}
.p-codeblock__dots{display:flex;gap:4px}.p-codeblock__dots span{width:8px;height:8px;border-radius:50%;background:var(--d-border)}
.p-codeblock pre{padding:16px;font-family:var(--d-font-mono);font-size:13px;line-height:1.7;color:var(--d-text);overflow-x:auto;margin:0}
.p-codeblock .hl-key{color:var(--d-accent)}.p-codeblock .hl-str{color:var(--d-accent-secondary)}.p-codeblock .hl-cmt{color:var(--d-muted)}

/* Product: trust logos */
.p-trust{padding:clamp(24px,3vw,40px) clamp(16px,4vw,48px);text-align:center;border-bottom:1px solid var(--d-border)}
.p-trust__label{font-size:12px;font-weight:500;color:var(--d-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:16px}
.p-trust__logos{display:flex;align-items:center;justify-content:center;gap:clamp(24px,4vw,48px);flex-wrap:wrap;opacity:0.4}
.p-trust__logos svg{height:24px;width:auto}

/* Brutalism: manifesto */
.p-manifesto{padding:clamp(32px,5vw,64px) clamp(16px,4vw,48px);border-top:2px solid var(--d-border);border-bottom:2px solid var(--d-border)}
.p-manifesto__text{font-family:var(--d-font-heading);font-size:clamp(1.5rem,4vw,3rem);font-weight:var(--d-heading-weight);letter-spacing:var(--d-heading-tracking);line-height:1.1;max-width:20ch;text-transform:uppercase}
.p-manifesto__text span{color:var(--d-accent)}

/* Playful: testimonial */
.p-testimonial{padding:var(--d-section-pad) clamp(16px,4vw,48px);text-align:center}
.p-testimonial__card{max-width:560px;margin:0 auto;background:var(--d-surface);border:1px solid var(--d-border);border-radius:var(--d-radius);padding:clamp(24px,3vw,40px)}
.p-testimonial__quote{font-size:clamp(16px,1.2vw,20px);line-height:1.6;margin-bottom:20px;color:var(--d-text)}
.p-testimonial__author{display:flex;align-items:center;gap:12px;justify-content:center}
.p-testimonial__avatar{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--d-accent) 15%,var(--d-surface))}
.p-testimonial__name{font-weight:600;font-size:14px}.p-testimonial__role{font-size:12px;color:var(--d-muted)}

/* ============================= */
/* LAYOUT AXIS — [data-layout]   */
/* ============================= */
[data-layout="editorial"] .p-hero__kicker{border:none;padding:0;font-family:var(--d-font-body);font-style:italic;text-transform:none;letter-spacing:0;font-size:14px;color:var(--d-accent-secondary)}
[data-layout="editorial"] .p-hero__title{font-style:italic;line-height:1.05}
[data-layout="editorial"] .p-feature{border-left:none;border-right:none;border-bottom:none;border-top:1px solid var(--d-border);border-radius:0;padding-left:0;padding-right:0}
[data-layout="editorial"] .p-feature__icon{border-radius:50%}
[data-layout="editorial"] .p-stat__number{color:var(--d-accent-secondary)}

[data-layout="technical"] .p-hero::before{content:'';position:absolute;top:-40%;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(99,102,241,0.12) 0%,transparent 70%);pointer-events:none}
[data-layout="technical"] .p-hero__kicker{background:var(--d-surface);border-color:var(--d-border)}

[data-layout="product"] .p-hero__kicker{background:color-mix(in srgb,var(--d-accent) 8%,transparent);border-color:color-mix(in srgb,var(--d-accent) 25%,transparent)}

[data-layout="brutalism"] .p-hero__title{text-transform:uppercase;line-height:0.95;max-width:14ch}
[data-layout="brutalism"] .p-hero__kicker{border-radius:0;padding:4px 10px;font-weight:700}

[data-layout="luxury"] .p-hero{padding-top:clamp(80px,12vw,180px);padding-bottom:clamp(80px,12vw,180px)}
[data-layout="luxury"] .p-hero__kicker{border:none;padding:0;letter-spacing:0.15em;font-family:var(--d-font-body);font-size:11px;color:var(--d-accent-secondary)}
[data-layout="luxury"] .p-hero__title{text-transform:uppercase;line-height:1.15}
[data-layout="luxury"] .p-hero__subtitle{font-size:clamp(13px,1vw,15px);letter-spacing:0.01em}
[data-layout="luxury"] .p-feature{text-align:center}
[data-layout="luxury"] .p-feature__icon{margin:0 auto 16px;width:48px;height:48px}
[data-layout="luxury"] .p-feature__title{font-size:16px;font-family:var(--d-font-body);font-weight:600}

[data-layout="playful"] .p-hero__kicker{font-weight:600;border-radius:100px}
[data-layout="playful"] .p-proof{border-radius:24px;margin:0 clamp(16px,2vw,32px)}

/* ============================= */
/* SURFACE AXIS — [data-surface] */
/* ============================= */
[data-surface="editorial"] .p-feature{background:transparent}
[data-surface="editorial"] .p-btn{border-radius:0;letter-spacing:0.04em;font-size:13px;text-transform:uppercase}
[data-surface="editorial"] .p-nav__cta{border-radius:0}
[data-surface="technical"] .p-feature{background:var(--d-surface);border-color:var(--d-border)}
[data-surface="technical"] .p-feature__icon{background:rgba(99,102,241,0.1)}
[data-surface="technical"] .p-btn--secondary{border-color:var(--d-border)}
[data-surface="technical"] .p-proof{background:var(--d-surface);border-color:var(--d-border)}
[data-surface="technical"] .p-stat__number{background:linear-gradient(135deg,#6366f1,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
[data-surface="technical"] .p-nav{border-color:var(--d-border)}
[data-surface="technical"] .p-footer{border-color:var(--d-border)}
[data-surface="product"] .p-feature{border-radius:16px}
[data-surface="product"] .p-feature__icon{border-radius:10px}
[data-surface="product"] .p-btn{border-radius:10px}
[data-surface="product"] .p-nav__cta{border-radius:8px}
[data-surface="brutalism"] .p-feature{border-width:2px}
[data-surface="brutalism"] .p-hero__kicker{border-width:2px}
[data-surface="brutalism"] .p-btn--primary{box-shadow:3px 3px 0 var(--d-accent-secondary)}
[data-surface="brutalism"] .p-btn--secondary{border-width:2px}
[data-surface="brutalism"] .p-proof{border-width:2px 0}

var BUILDERS={editorial:buildEditorial,technical:buildTechnical,product:buildProduct,brutalism:buildBrutalism,luxury:buildLuxury,playful:buildPlayful};

function buildPreview(layoutId){
  return (BUILDERS[layoutId]||buildProduct)();
}

/* ---- Apply direction ---- */
function applyDirection(container,opts){
  var el=document.createElement("div");
  el.className="preview";
  el.setAttribute("data-layout",opts.layout);
  el.setAttribute("data-surface",opts.surface);
  el.setAttribute("data-motion",opts.motion);
  var vars=Object.assign({},opts.typo,opts.color,opts.surfaceVars);
  var s="";Object.keys(vars).forEach(function(k){s+=k+":"+vars[k]+";";});
  el.setAttribute("style",s);
  el.innerHTML=buildPreview(opts.layout);
  container.innerHTML="";
  container.appendChild(el);
}

/* ---- Contrast ---- */
function hexToSRGB(h){h=h.replace("#","");if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return[parseInt(h.substr(0,2),16)/255,parseInt(h.substr(2,2),16)/255,parseInt(h.substr(4,2),16)/255];}
function luminance(c){var l=c.map(function(v){return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*l[0]+0.7152*l[1]+0.0722*l[2];}
function contrastRatio(a,b){var l1=luminance(hexToSRGB(a)),l2=luminance(hexToSRGB(b));return(Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);}
function firstHex(v){var m=v.match(/#[0-9a-fA-F]{3,8}/);return m?m[0]:null;}

/* ---- State ---- */
var activeDir=0,compareMode=false,compareSlots=[0,null],mixerActive=false;
var dirList=document.getElementById("dir-list"),previewArea=document.getElementById("preview-area"),previewA=document.getElementById("preview-a"),previewB=document.getElementById("preview-b"),paneB=document.getElementById("pane-b"),paneLabelA=document.getElementById("pane-a-label"),paneLabelB=document.getElementById("pane-b-label"),compareBtn=document.getElementById("compare-btn"),mixerBtn=document.getElementById("mixer-btn"),mixerPanel=document.getElementById("mixer-panel"),toastEl=document.getElementById("toast"),sidebar=document.getElementById("sidebar"),backdrop=document.getElementById("backdrop"),menuBtn=document.getElementById("menu-btn"),contrastWarn=document.getElementById("contrast-warn");
var toastTimer;function toast(m){clearTimeout(toastTimer);toastEl.textContent=m;toastEl.classList.add("visible");toastTimer=setTimeout(function(){toastEl.classList.remove("visible");},1800);}

/* ---- Sidebar ---- */
function renderDirList(){
  dirList.innerHTML="";
  DIRS.forEach(function(d,i){
    var c=document.createElement("div");c.className="dir-card";c.setAttribute("tabindex","0");c.setAttribute("role","button");c.setAttribute("aria-pressed",String(i===activeDir));c.setAttribute("aria-label",d.name);
    var dots=d.palette.map(function(cl){return '<div class="dir-card__swatch" style="background:'+cl+'"></div>';}).join("");
    var defTag=d.definitionPath?'<div style="font-size:10px;color:var(--shell-accent);margin-top:4px;opacity:0.8">Definition: '+d.definitionPath+'</div>':'';
    c.innerHTML='<button class="dir-card__compare" role="checkbox" aria-checked="false" aria-label="Add '+d.name+' to comparison" data-idx="'+i+'" tabindex="0"><svg class="dir-card__check" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6l2.5 2.5 4.5-5"/></svg></button><div class="dir-card__name">'+d.name+'</div><div class="dir-card__desc">'+d.desc+'</div>'+defTag+'<div class="dir-card__palette">'+dots+'</div>';
    c.addEventListener("click",function(e){if(e.target.closest(".dir-card__compare"))return;selectDirection(i);});
    c.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){if(e.target.closest(".dir-card__compare"))return;e.preventDefault();selectDirection(i);}});
    dirList.appendChild(c);
  });
  dirList.querySelectorAll(".dir-card__compare").forEach(function(btn){
    btn.addEventListener("click",function(e){e.stopPropagation();toggleCompareSlot(+btn.dataset.idx);});
    btn.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.stopPropagation();e.preventDefault();toggleCompareSlot(+btn.dataset.idx);}});
  });
}
function selectDirection(i){activeDir=i;renderPreview();updateCardStates();closeMobile();}
function updateCardStates(){dirList.querySelectorAll(".dir-card").forEach(function(c,i){c.setAttribute("aria-pressed",String(i===activeDir));});dirList.querySelectorAll(".dir-card__compare").forEach(function(b){b.setAttribute("aria-checked",String(compareSlots.indexOf(+b.dataset.idx)!==-1));});}

/* ---- Compare ---- */
function toggleCompareSlot(idx){var p=compareSlots.indexOf(idx);if(p!==-1)compareSlots[p]=null;else{if(compareSlots[0]===null)compareSlots[0]=idx;else if(compareSlots[1]===null)compareSlots[1]=idx;else{compareSlots[0]=compareSlots[1];compareSlots[1]=idx;}}if(compareSlots[0]!==null&&compareSlots[1]!==null&&!compareMode)enterCompare();else if(compareMode&&(compareSlots[0]===null||compareSlots[1]===null))exitCompare();renderPreview();updateCardStates();}
function enterCompare(){compareMode=true;previewArea.classList.add("compare-mode");paneB.style.display="";compareBtn.setAttribute("aria-pressed","true");}
function exitCompare(){compareMode=false;previewArea.classList.remove("compare-mode");paneB.style.display="none";compareBtn.setAttribute("aria-pressed","false");}
compareBtn.addEventListener("click",function(){if(compareMode){compareSlots=[activeDir,null];exitCompare();renderPreview();updateCardStates();toast("Exited compare mode");}else{if(compareSlots[0]===null)compareSlots[0]=activeDir;if(compareSlots[1]===null)compareSlots[1]=(activeDir+1)%DIRS.length;enterCompare();renderPreview();updateCardStates();toast("Compare: pick two directions");}});

/* ---- Mixer ---- */
var mixSelects={typo:document.getElementById("mix-typo"),color:document.getElementById("mix-color"),layout:document.getElementById("mix-layout"),surface:document.getElementById("mix-surface"),motion:document.getElementById("mix-motion")};
(function(){Object.keys(mixSelects).forEach(function(k){var s=mixSelects[k];DIRS.forEach(function(d,i){var o=document.createElement("option");o.value=i;o.textContent=d.name;s.appendChild(o);});});})();
mixerBtn.addEventListener("click",function(){mixerActive=!mixerActive;mixerBtn.setAttribute("aria-pressed",String(mixerActive));mixerPanel.classList.toggle("active",mixerActive);if(!mixerActive){contrastWarn.classList.remove("visible");renderPreview();toast("Mixer off — curated direction restored");}});
document.getElementById("mix-apply").addEventListener("click",function(){renderMixedPreview();});
document.getElementById("mix-reset").addEventListener("click",function(){Object.keys(mixSelects).forEach(function(k){mixSelects[k].value=activeDir;});contrastWarn.classList.remove("visible");renderCurated(previewA,activeDir);paneLabelA.textContent=DIRS[activeDir].name;toast("Reset to "+DIRS[activeDir].name);});

function renderMixedPreview(){
  var t=DIRS[+mixSelects.typo.value],c=DIRS[+mixSelects.color.value],l=DIRS[+mixSelects.layout.value],su=DIRS[+mixSelects.surface.value],mo=DIRS[+mixSelects.motion.value];
  applyDirection(previewA,{layout:l.layout,surface:su.surface,motion:mo.motion,typo:t.typo,color:c.color,surfaceVars:su.surfaceVars});
  paneLabelA.textContent="Custom Mix";
  var bg=firstHex(c.color["--d-bg"]),tx=firstHex(c.color["--d-text"]),mu=firstHex(c.color["--d-muted"]),w=false;
  if(bg&&tx&&contrastRatio(bg,tx)<4.5)w=true;if(bg&&mu&&contrastRatio(bg,mu)<3)w=true;
  contrastWarn.classList.toggle("visible",w);
  if(w)toast("Low contrast detected — check color + surface pairing");else toast("Custom mix applied");
}

/* ---- Render ---- */
function renderCurated(container,idx){var d=DIRS[idx];applyDirection(container,{layout:d.layout,surface:d.surface,motion:d.motion,typo:d.typo,color:d.color,surfaceVars:d.surfaceVars});}
function renderPreview(){
  if(compareMode){var a=compareSlots[0]!==null?compareSlots[0]:activeDir,b=compareSlots[1]!==null?compareSlots[1]:(activeDir+1)%DIRS.length;renderCurated(previewA,a);renderCurated(previewB,b);paneLabelA.textContent=DIRS[a].name;paneLabelB.textContent=DIRS[b].name;}
  else{renderCurated(previewA,activeDir);paneLabelA.textContent=DIRS[activeDir].name;}
  Object.keys(mixSelects).forEach(function(k){mixSelects[k].value=activeDir;});contrastWarn.classList.remove("visible");
}

/* ---- Mobile ---- */
function closeMobile(){sidebar.classList.remove("open");backdrop.classList.remove("open");menuBtn.setAttribute("aria-expanded","false");}
menuBtn.addEventListener("click",function(){var o=sidebar.classList.toggle("open");backdrop.classList.toggle("open",o);menuBtn.setAttribute("aria-expanded",String(o));});
backdrop.addEventListener("click",closeMobile);

/* ---- Brief export ---- */
function getDirectionBrief(idx){
  var d=DIRS[idx];
  var lines=["# "+d.name+" — Direction Brief","","## Principle",d.principle||d.desc,"","## Explorer demonstration values","Typography: "+d.typo["--d-font-heading"]+" / "+d.typo["--d-font-body"],"Hero size: "+d.typo["--d-hero-size"],"Palette: "+d.palette.join(", "),"Border radius: "+d.surfaceVars["--d-radius"],"Motion: "+d.motion,"","## Project guidance"];
  if(d.definitionPath){lines.push("Full definition: "+d.definitionPath);lines.push("Load this definition before developing a proposal. Explorer values above are demonstrations — derive project-specific typography, palette and layout from the brief and reference evidence.");}
  else{lines.push("No canonical definition file yet. Explorer values are starting points; adapt to the project brief.");}
  lines.push("","## Notes","- Demo content (FlowStack, stats, quotes) is fictional — do not transfer into client work.","- Record chosen interpretation in the project DESIGN.md.");
  return lines.join("\n");
}
function copyBrief(){
  var text=getDirectionBrief(activeDir);
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast("Brief copied to clipboard");},function(){toast("Copy failed — check permissions");});}
  else{toast("Clipboard API unavailable");}
}

document.getElementById("brief-btn").addEventListener("click",copyBrief);

/* ---- Init ---- */
renderDirList();renderPreview();
})();
</script>
